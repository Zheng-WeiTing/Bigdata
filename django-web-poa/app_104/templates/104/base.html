<!DOCTYPE html>
{% load static %}
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}104人力銀行分析平台{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.13.0/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js"></script>

    <style>
        body {
            min-height: 100vh;
            background-color: #f6f6f6;
        }

        /* top-section：上方標題列 */
        .header-area {
            background-color: #6d6f5e;
            border-bottom: 1px solid #a7a58d;
        }

        .platform-brand {
            margin: 0;
            line-height: 1.2;
        }

        .platform-brand a {
            text-decoration: none;
        }

        .platform-name {
            display: block;
            font-size: 1.2rem;
            color: #ffe9d7;
            font-weight: 600;
        }

        .platform-subtitle {
            display: block;
            font-size: 1rem;
            color: #dcc0aa;
            text-align: center;
        }

        .welcome-text {
            color: #ffe9d7;
            font-size: 1.8rem;
            margin: 0;
            font-weight: 500;
            white-space: nowrap;
        }

        #current-time {
            font-size: 1rem;
            color: #dcc0aa;
            white-space: nowrap;
        }

        /* sidebar：左側導覽列 */
        .sidebar {
            background: #ededeb;
            border-right: 1px solid #a6afe0;
            min-height: calc(100vh - 80px);
            position: relative;
        }

        .nav-links-wrapper {
            margin-bottom: 80px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 1rem;
            color: #6d6f5e;
            text-decoration: none;
            transition: all 0.3s ease;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #404976;
            color: #ffe9d7;
        }

        .nav-icon {
            font-size: 1.2rem;
            margin-right: 1rem;
        }

        .nav-link:hover .nav-icon,
        .nav-link.active .nav-icon {
            color: #f8eeff;
        }

        .bottom-button-wrapper {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
        }

        /* content-area：右側主要內容 */
        .content-area {
            min-width: 0;
            overflow-x: hidden;
        }

        @media (max-width: 767.98px) {
            .sidebar {
                min-height: auto;
                border-right: none;
                border-bottom: 1px solid #a6afe0;
            }

            .bottom-button-wrapper {
                position: static;
                width: 100%;
                transform: none;
            }

            .nav-links-wrapper {
                margin-bottom: 20px;
            }

            .welcome-text {
                font-size: 1.4rem;
            }

            #current-time {
                font-size: 0.9rem;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- grid-container：整個頁面 -->
    <div class="container-fluid p-0">

        <!-- top-section：上方標題區 -->
        <header class="header-area">
            <div class="row align-items-center g-0 px-3 px-md-4 py-3">

                <!-- platform-section：平台名稱 -->
                <div class="col-12 col-md-4 d-flex justify-content-center justify-content-md-start mb-2 mb-md-0">
                    <h1 class="platform-brand">
                        <a href="{% url 'app_104:home' %}">
                            <span class="platform-name">104人力銀行</span>
                            <span class="platform-subtitle">分析平台</span>
                        </a>
                    </h1>
                </div>

                <!-- welcome-section：目前頁面名稱 -->
                <div class="col-12 col-md-4 d-flex justify-content-center mb-2 mb-md-0">
                    <h2 class="welcome-text">{% block page_title %}{% endblock %}</h2>
                </div>

                <!-- time-section：目前時間 -->
                <div class="col-12 col-md-4 d-flex justify-content-center justify-content-md-end">
                    <span id="current-time"></span>
                </div>

            </div>
        </header>

        <!-- main-container：側邊欄與主要內容 -->
        <div class="row g-0">

            <!-- sidebar：左側導覽列 -->
            <nav class="sidebar col-12 col-md-3 col-lg-2 p-3 p-lg-4">

                <div class="nav-links-wrapper">
                    <a href="{% url 'area_analysis:home' %}" class="nav-link {% if request.resolver_match.namespace == 'area_analysis' %}active{% endif %}">
                        <i class="bi bi-briefcase-fill nav-icon"></i>
                        <span>職缺詳情</span>
                    </a>

                    <a href="{% url 'top_keyword:home' %}" class="nav-link {% if request.resolver_match.namespace == 'top_keyword' %}active{% endif %}">
                        <i class="bi bi-search nav-icon"></i>
                        <span>熱門關鍵字</span>
                    </a>

                    <a href="{% url 'search_keyword:home' %}" class="nav-link {% if request.resolver_match.namespace == 'search_keyword' %}active{% endif %}">
                        <i class="bi bi-clock-fill nav-icon"></i>
                        <span>關鍵字趨勢</span>
                    </a>

                    <a href="{% url 'salary_analysis:home' %}" class="nav-link {% if request.resolver_match.namespace == 'salary_analysis' %}active{% endif %}">
                        <i class="bi bi-cash-stack nav-icon"></i>
                        <span>薪資分析</span>
                    </a>

                    <a href="{% url 'tool_analysis:home' %}" class="nav-link {% if request.resolver_match.namespace == 'tool_analysis' %}active{% endif %}">
                        <i class="bi bi-tools nav-icon"></i>
                        <span>擅長工具分析</span>
                    </a>

                    <a href="{% url 'conditional_analysis:home' %}" class="nav-link {% if request.resolver_match.namespace == 'conditional_analysis' %}active{% endif %}">
                        <i class="bi bi-person-badge-fill nav-icon"></i>
                        <span>個人條件分析</span>
                    </a>

                    <a href="{% url 'trait_analysis:home' %}" class="nav-link {% if request.resolver_match.namespace == 'trait_analysis' %}active{% endif %}">
                        <i class="bi bi-stars nav-icon"></i>
                        <span>個人特質分析</span>
                    </a>
                </div>

                <div class="bottom-button-wrapper">
                    <a href="/" class="btn btn-primary w-100 fw-bold" style="background-color:#404976; border-color:#404976;">
                        返回輿情大數據
                    </a>
                </div>

            </nav>

            <!-- content-area：右側頁面內容 -->
            <main class="content-area col-12 col-md-9 col-lg-10">
                {% block content %}{% endblock %}
            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function updateTime() {
            const now = new Date();
            const options = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };

            document.getElementById('current-time').textContent = now.toLocaleDateString('zh-TW', options);
        }

        updateTime();
        setInterval(updateTime, 1000);
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
